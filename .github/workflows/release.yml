name: Official-aligned release binaries and images
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.release.tag_name }}
  images:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: panel, dockerfile: Dockerfile, suffix: ''}
          - {component: agent, dockerfile: release/agent.Dockerfile, suffix: '-agent'}
          - {component: bridge, dockerfile: release/bridge.Dockerfile, suffix: '-mcp'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify prebuilt release assets
        run: cd dist && sha256sum -c sha256sums.txt
      - name: Compute registry name
        env:
          REPOSITORY: ${{ github.repository }}
          SUFFIX: ${{ matrix.suffix }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}${SUFFIX}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: dist
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
  attach:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Attach verified official-named release files without overwriting existing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum -c sha256sums.txt
          gh release upload "$VERSION" ./* --repo "$REPOSITORY"
  promote-stable:
    needs: attach
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest only for GitHub's current latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "$VERSION" ]; then exit 0; fi
          for suffix in '' -agent -mcp; do
            image="ghcr.io/${REPOSITORY,,}${suffix}"
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done
