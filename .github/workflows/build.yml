name: Build and validate
on:
  push:
    branches: [main, 'codex/**', 'upstream/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ inputs.version || format('Snapshot-{0}', github.sha) }}
  GOTOOLCHAIN: local
jobs:
  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Real Windows ConPTY and persistent PowerShell protocol
        run: python dev/validate-windows-terminal.py
      - name: Patched Windows agent completion and deadline protection
        run: python dev/validate-windows-terminal.py --agent
      - name: Build standalone diagnostic probe for YDY without a Go installation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Push-Location bridge
          try {
            go test -c -o ../probe/komari-conpty-probe-windows-amd64.exe ./internal/terminal
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostic probe build failed' }
          } finally { Pop-Location }
          $hash = (Get-FileHash probe/komari-conpty-probe-windows-amd64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  komari-conpty-probe-windows-amd64.exe" | Set-Content probe/sha256sums.txt -Encoding ascii
          git rev-parse HEAD | Set-Content probe/source-commit.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: komari-windows-conpty-probe
          path: probe/*
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend
  tests:
    needs: [frontend, windows-terminal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bridge/go.sum
            bridge/validation/nativechain/go.sum
      - name: Installer and upstream synchronization regression tests
        run: python3 -m unittest discover -s release/tests -v
      - uses: ./.github/actions/restore-frontend
      - name: Panel unit tests
        run: go test -race ./internal/mcpbridge ./web/router ./web/api/terminal ./web/connection ./web/api/client -count=1
      - name: Bridge including actual standalone daemon and stdio adapter
        run: |
          bash release/build.sh bridge linux amd64 "$RELEASE_VERSION" "$RUNNER_TEMP/bin"
          cd bridge
          KOMARI_MCP_TEST_BINARY="$RUNNER_TEMP/bin/komari-mcp-linux-amd64" go test -race ./... -count=1
      - name: Patched agent regression tests
        run: |
          umask 022
          python3 release/prepare.py agent "$RUNNER_TEMP/komari-agent-dev"
          cd "$RUNNER_TEMP/komari-agent-dev"
          go test -race ./executionguard ./monitoring/unit ./cmd/flags ./cmd ./monitoring ./terminal ./ws -count=1
          go test -race ./server -run 'Test(MonitorControlFramesRefreshReadDeadline|OutputBudget|TaskDeadline)' -count=1
      - name: Actual native panel-agent-MCP loopback chain
        run: |
          cd bridge/validation/nativechain
          cp go.mod "$RUNNER_TEMP/nativechain.mod"
          cp go.sum "$RUNNER_TEMP/nativechain.sum"
          go mod edit -modfile="$RUNNER_TEMP/nativechain.mod" -replace="github.com/komari-monitor/komari-agent=$RUNNER_TEMP/komari-agent-dev"
          go test -mod=mod -modfile="$RUNNER_TEMP/nativechain.mod" -race ./... -count=1 -timeout=90s
  panel:
    needs: [frontend, tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, zig: x86_64-linux-musl}
          - {os: linux, arch: arm64, zig: aarch64-linux-musl}
          - {os: linux, arch: '386', zig: x86-linux-musl}
          - {os: linux, arch: riscv64, zig: riscv64-linux-musl}
          - {os: linux, arch: loong64, zig: loongarch64-linux-musl}
          - {os: windows, arch: amd64, zig: x86_64-windows-gnu}
          - {os: windows, arch: arm64, zig: aarch64-windows-gnu}
          - {os: windows, arch: '386', zig: x86-windows-gnu}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/restore-frontend
      - name: Build official-compatible CGO panel binary
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CC: zig cc -target ${{ matrix.zig }}
        run: bash release/build.sh panel "$TARGET_OS" "$TARGET_ARCH" "$RELEASE_VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: panel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  agent-and-bridge:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          - {os: linux, arch: '386'}
          - {os: linux, arch: arm}
          - {os: linux, arch: loong64}
          - {os: windows, arch: amd64}
          - {os: windows, arch: arm64}
          - {os: windows, arch: '386'}
          - {os: darwin, arch: amd64}
          - {os: darwin, arch: arm64}
          - {os: freebsd, arch: amd64}
          - {os: freebsd, arch: arm64}
          - {os: freebsd, arch: '386'}
          - {os: freebsd, arch: arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: bridge/go.sum
      - name: Build patched agent and resident bridge
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          bash release/build.sh agent "$TARGET_OS" "$TARGET_ARCH" "$RELEASE_VERSION" dist "$RUNNER_TEMP/komari-agent-dev"
          bash release/build.sh bridge "$TARGET_OS" "$TARGET_ARCH" "$RELEASE_VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  windows-smoke:
    needs: [panel, agent-and-bridge]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: bridge/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: panel-windows-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tools-windows-amd64
          path: dist
      - name: Parse official-derived installer and execute native Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'Windows installer syntax errors' }
          & .\dist\komari-mcp-windows-amd64.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Bridge binary failed to execute' }
          & .\dist\komari-agent-windows-amd64.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Agent binary failed to execute' }
          & .\dist\komari-windows-amd64.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'CGO panel binary failed to execute' }
      - name: Persist real scoped keys on Windows
        working-directory: bridge
        run: go test ./internal/access ./internal/execution ./internal/app ./internal/diagnostics -count=1
  bundle:
    needs: [panel, agent-and-bridge, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: panel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: tools-*
          path: dist
          merge-multiple: true
      - name: Require complete assets and generate checksums and source provenance
        run: |
          cp install-komari.sh install.sh install.ps1 dist/
          cp release/compose.yml dist/compose.yml
          cp bridge/deploy/example.env dist/komari-mcp.env.example
          cp bridge/deploy/komari-mcp.service dist/
          cp release/README.md dist/INSTALL.md
          cp release/AI_REVIEW_SETUP.zh-CN.md release/upgrade-ydy-tyysj-prompt.zh-CN.md dist/
          cp LICENSE LICENSE.komari-agent NOTICE ATTRIBUTION.md dist/
          python3 release/manifest.py dist "$RELEASE_VERSION"
          cd dist
          sha256sum -c sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
