name: Merge an approved upstream candidate
on:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ['Build and validate']
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Upstream sync PR number to recheck
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: upstream-review-merge
  cancel-in-progress: false
jobs:
  gate:
    if: vars.UPSTREAM_REVIEWER_LOGINS != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Never execute privileged code from the PR or workflow_run head branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check approved identity, exact SHA, successful build and GitHub protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_REVIEWER_LOGINS: ${{ vars.UPSTREAM_REVIEWER_LOGINS }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            python3 release/review-gate.py --repository "$REPOSITORY" --number "$PR_NUMBER"
          else
            python3 release/review-gate.py --repository "$REPOSITORY" --sha "$RUN_SHA"
          fi
