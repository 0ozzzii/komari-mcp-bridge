# Review-only example: add within the existing HTTPS server after confirming
# the actual reverse-proxy layout. Do not expose the control listener.
location = /mcp {
    proxy_pass http://127.0.0.1:8967;
    proxy_http_version 1.1;
    # MCP SDK v1.8 defaults to localhost DNS-rebinding protection. Preserve
    # that check by presenting the correct loopback upstream Host.
    proxy_set_header Host 127.0.0.1:8967;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
}
