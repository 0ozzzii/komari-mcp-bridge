services:
  komari-mcp:
    image: ghcr.io/0ozzzii/komari-mcp-bridge-mcp:${KOMARI_RELEASE_VERSION:?Set an explicit published release tag}
    restart: unless-stopped
    env_file: ./komari-mcp.env
    environment:
      BRIDGE_BIND_ADDRESS: 0.0.0.0:8967
      BRIDGE_CONTROL_ADDRESS: 0.0.0.0:8968
      BRIDGE_ALLOW_INTERNAL_CONTROL: "1"
      BRIDGE_STATE_DIR: /state
    ports:
      - "127.0.0.1:8967:8967"
      - "127.0.0.1:8968:8968"
    volumes:
      - bridge-state:/state
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  bridge-state:
